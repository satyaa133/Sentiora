# Local development services. Ports bind to 127.0.0.1 so the dev database,
# unauthenticated Redis and pgAdmin are not reachable from the LAN; set
# BIND_ADDRESS=0.0.0.0 only when you deliberately need LAN access.
#
#   docker compose up -d                  # postgres, redis, pgadmin (infra only)
#   docker compose --profile app up -d    # also containerised backend + worker
#
# The backend/worker are opt-in so they never compete with host `npm start` /
# `npm run dev:worker` processes for port 8000 and the capture queue.
services:
  postgres:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    image: sentiora-postgres-pgvector:16
    container_name: sentiora-postgres
    environment:
      POSTGRES_DB: Sentiora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Sentiora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sentiora-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiora-backend
    profiles: ["app"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: ${APP_NAME:-Sentiora Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV}@postgres:5432/Sentiora
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    volumes:
      - ./backend:/app/backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiora-worker
    profiles: ["app"]
    command: ["python", "-m", "app.workers.worker"]
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: ${APP_NAME:-Sentiora Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV}@postgres:5432/Sentiora
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sentiora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sentiora.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
