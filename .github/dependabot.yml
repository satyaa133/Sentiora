# Weekly dependency update PRs. Minor and patch updates are grouped into one PR
# per ecosystem to keep the noise down; major updates come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/infrastructure/postgres"]
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(docker)"
