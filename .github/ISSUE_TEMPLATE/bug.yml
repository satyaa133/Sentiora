name: Bug
description: Something in the web app, extension or API doesn't work as it should.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in at http://localhost:5173
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Extension
        - Backend / API
        - Worker / capture
        - Ask / retrieval
        - CI / tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Branch or commit
      placeholder: main @ 1a2b3c4
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include the request ID (req_…) if there is one. Remove keys, tokens and personal data first.
      render: text
