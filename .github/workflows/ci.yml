name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: Sentiora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CHANGE_ME_LOCAL_DEV
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Queues, rate limits, the AI gate and the answer cache.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME_LOCAL_DEV@localhost:5432/Sentiora
        run: |
          cd backend && alembic upgrade head

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME_LOCAL_DEV@localhost:5432/Sentiora
        run: npm run test

      # Retrieval and instant-answer eval on the original fixture library
      # (REBUILD_PLAN S8, D15). Local CPU models only: no AI provider is called.
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: backend/.models
          key: models-nomic-embed-text-v1.5-Q-jina-reranker-v1-tiny-en

      - name: Retrieval and answer eval (fixture library)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME_LOCAL_DEV@localhost:5432/Sentiora
          EMBEDDING_PROVIDER: local
          LOCAL_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5-Q
          RERANKER_MODEL: jinaai/jina-reranker-v1-tiny-en
          RAG_MIN_SIMILARITY: "0.65"
          RAG_QUESTION_MIN_SIMILARITY: "0.60"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          cd backend
          python -c "from app.services.embedding_service import download_local_model; download_local_model()"
          python -c "from app.services.retrieval.reranker import download_reranker; download_reranker()"
          cd ..
          npm run eval:rag:ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end API flow
        env:
          DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME_LOCAL_DEV@localhost:5432/Sentiora
          REDIS_URL: redis://localhost:6379/0
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Check client bundles for secrets
        run: npm run check:secrets
