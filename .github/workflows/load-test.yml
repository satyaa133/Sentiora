# S9 load test on a GitHub-hosted runner (REBUILD_PLAN S9, D17): the
# production stack plus the load override, 500 seeded users, k6 in Docker.
# Settings are in scripts/load/ci.env; secrets are generated for each run.
# Results (k6 summary, server samples, API log) are uploaded as an artifact.
name: Load test

on:
  workflow_dispatch:
  push:
    branches: [feat/s9-load-test]
    paths:
      - scripts/load/**
      - .github/workflows/load-test.yml

concurrency:
  group: load-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      L: docker compose -f docker-compose.prod.yml -f scripts/load/docker-compose.load.yml --env-file scripts/load/.env.load
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Runner size
        run: |
          echo "CPUs: $(nproc)"; free -h; docker compose version
          {
            echo "### Runner"
            echo "- CPUs: $(nproc)"
            echo "- Memory: $(free -h | awk '/Mem:/ {print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the load env file (throwaway secrets)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "LOAD_USER_PASSWORD=Ld-$(openssl rand -hex 12)"
            echo 'CORS_ORIGINS=["http://localhost:8090"]'
            echo "WEB_PORT=8090"
            grep -E '^[A-Z_]+=' scripts/load/ci.env
          } > scripts/load/.env.load
          mkdir -p scripts/load/results
          {
            echo "### Settings"
            grep -E '^[A-Z_]+=' scripts/load/ci.env | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build images
        run: $L build migrate web

      - name: Start the stack
        run: |
          $L up -d
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sentiora-load-web-1 2>/dev/null || echo starting)
            [ "$status" = healthy ] && break
            sleep 5
          done
          $L ps
          [ "$status" = healthy ] || { $L logs --tail 50 backend; exit 1; }
          $L logs backend | grep -i "warmed" || true

      - name: Seed users
        run: $L --profile load run --rm seed

      - name: Run k6 (with server sampling)
        id: k6
        continue-on-error: true
        run: |
          DURATION=1200 bash scripts/load/monitor.sh > scripts/load/results/monitor-console.txt 2>&1 &
          echo $! > /tmp/monitor.pid
          $L --profile load run --rm k6 2>&1 | grep -vE '\[ *[0-9]+% \]|running \(' | tee scripts/load/results/k6.txt
          exit "${PIPESTATUS[0]}"

      - name: Collect results
        if: always()
        run: |
          kill "$(cat /tmp/monitor.pid)" 2>/dev/null || true
          $L logs --no-color backend > scripts/load/results/backend.log 2>&1 || true
          $L logs --no-color worker > scripts/load/results/worker.log 2>&1 || true
          docker stats --no-stream > scripts/load/results/docker-stats-end.txt || true
          {
            echo "### k6 summary"
            echo '```'
            sed -n '/checks\.\.\./,$p' scripts/load/results/k6.txt | grep -vE '^\s*$' | head -60
            echo '```'
            echo "### Server samples (last 15)"
            echo '```'
            tail -15 scripts/load/results/monitor-console.txt
            echo '```'
            echo "### Errors in the API log"
            echo '```'
            grep -cE '" 5[0-9][0-9] |"level": "ERROR"' scripts/load/results/backend.log || true
            grep -E '"level": "ERROR"|Traceback|QueuePool limit' scripts/load/results/backend.log | head -10 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: scripts/load/results/
          retention-days: 30

      - name: Fail when a target was missed
        if: steps.k6.outcome == 'failure'
        run: |
          echo "k6 thresholds failed: see the summary above."
          exit 1
